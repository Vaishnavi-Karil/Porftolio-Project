name: Vaishnavi Dev Config
version: 1.0.0
schema: v1

models:
  # 🔹 OpenAI (optional)

  # 🔹 Claude (paid - best for reasoning/debugging)
  - name: Claude Sonnet
    provider: anthropic
    model: claude-3-5-sonnet
    apiKey: YOUR_ANTHROPIC_API_KEY

  - name: GPT-5
    provider: openai
    model: gpt-5
    apiKey: YOUR_OPENAI_API_KEY_HERE

  # 🔹 Local FREE model (recommended for daily coding)
  - name: Qwen Coder (Local)
    provider: ollama
    model: qwen2.5-coder-7b


mcpServers:
  - uses: anthropic/memory-mcp